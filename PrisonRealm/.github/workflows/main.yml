name: Build PrisonRealm

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check source folder
        run: ls -la PrisonRealm

      - name: Build plugin
        working-directory: PrisonRealm
        run: gradle build

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: PrisonRealm-JAR
          path: PrisonRealm/build/libs/*.jar
          if-no-files-found: error
