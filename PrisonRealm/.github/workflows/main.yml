name: Build PrisonRealm

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check PrisonRealm files
        run: |
          echo "Checking project files..."
          ls -la
          ls -la PrisonRealm
          test -f PrisonRealm/build.gradle
          test -f PrisonRealm/settings.gradle

      - name: Build PrisonRealm plugin
        working-directory: PrisonRealm
        run: gradle build --stacktrace

      - name: Upload PrisonRealm JAR
        uses: actions/upload-artifact@v4
        with:
          name: PrisonRealm-JAR
          path: PrisonRealm/build/libs/*.jar
          if-no-files-found: error
