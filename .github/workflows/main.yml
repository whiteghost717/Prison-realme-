name: Build PrisonRealm

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: PrisonRealm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check project files
        run: ls -la

      - name: Build plugin
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build
          elif [ -f ./gradle/wrapper/gradle-wrapper.properties ]; then
            gradle build
          else
            echo "Gradle wrapper is missing from PrisonRealm."
            exit 1
          fi

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PrisonRealm-JAR
          path: PrisonRealm/build/libs/*.jar
          if-no-files-found: error
