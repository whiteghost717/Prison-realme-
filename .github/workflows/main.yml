name: Build PrisonRealm

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find project and build
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la

          if [ -f "PrisonRealm/build.gradle" ]; then
            cd PrisonRealm
          elif [ -f "build.gradle" ]; then
            cd .
          else
            echo "ERROR: build.gradle was not found."
            find . -maxdepth 4 -type f \( -name build.gradle -o -name settings.gradle \)
            exit 1
          fi

          echo "Building from: $(pwd)"
          gradle build --stacktrace

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PrisonRealm-JAR
          path: |
            PrisonRealm/build/libs/*.jar
            build/libs/*.jar
          if-no-files-found: error
